<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BGMI Tournaments</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Orbitron', sans-serif;
}

body {
    color: white;
    text-align: center;
    background: url('bgmi.jpg') no-repeat center/cover;
}

/* Dark overlay */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.75);
    top: 0;
    left: 0;
    z-index: -1;
}

/* CLOSE BUTTON (X) */
.close-btn {
    position: fixed;
    top: 15px;
    right: 20px;
    font-size: 32px;
    color: white;
    text-decoration: none;
    border: 2px solid red;
    width: 45px;
    height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: 0.3s;
    box-shadow: 0 0 10px red;
}

.close-btn:hover {
    background: red;
    transform: scale(1.1) rotate(90deg);
    box-shadow: 0 0 30px red;
}

/* HEADER */
header {
    padding: 25px;
    font-size: 30px;
    color: red;
    text-shadow: 0 0 20px red;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 25px;
    padding: 40px;
}

/* CARD */
.card {
    border: 2px solid red;
    padding: 25px;
    border-radius: 12px;
    transition: 0.4s;
    backdrop-filter: blur(8px);
    background: rgba(0,0,0,0.6);
    position: relative;
    overflow: hidden;
}

/* Glow animation */
.card::before {
    content: "";
    position: absolute;
    width: 150%;
    height: 150%;
    background: linear-gradient(120deg, transparent, rgba(255,0,0,0.4), transparent);
    top: -100%;
    left: -100%;
    transition: 0.6s;
}

.card:hover::before {
    top: 100%;
    left: 100%;
}

/* Hover */
.card:hover {
    transform: scale(1.07);
    box-shadow: 0 0 40px red;
}

/* BUTTON */
.btn {
    margin-top: 15px;
    padding: 10px 20px;
    border: none;
    background: red;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    background: white;
    color: red;
}
</style>
</head>

<body>

<!-- CLOSE BUTTON -->
<a href="index.html" class="close-btn">&times;</a>

<header>🔥 BGMI TOURNAMENTS 🔥</header>

<div class="grid">

<div class="card">
<h2>Weekly Scrims</h2>
<p>Every week practice matches</p>
<button class="btn">Join Now</button>
</div>

<div class="card">
<h2>Saturday Blast</h2>
<p>Weekend intense battles</p>
<button class="btn">Join Now</button>
</div>

<div class="card">
<h2>Sunday Blast</h2>
<p>End the week with action</p>
<button class="btn">Join Now</button>
</div>

<div class="card">
<h2>TDM 1v1</h2>
<p>Test your aim skills</p>
<button class="btn">Join Now</button>
</div>

<div class="card">
<h2>Prize Pool Match</h2>
<p>Win real rewards</p>
<button class="btn">Join Now</button>
</div>

</div>

</body>
</html>
