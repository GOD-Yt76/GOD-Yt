<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livestream Goal Bar</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
  }

  .goal-wrap {
    width: min(900px, 94vw);
    margin: 40px auto;
  }

  .goal-bar {
    position: relative;
    height: 58px;
    overflow: hidden;
    background: #fff;
    border: 4px solid #111;
    border-radius: 2px;
  }

  /* Green automatically changes width from current / goal */
  .progress {
    position: absolute;
    inset: 0 auto 0 0;
    width: 35.32%;
    background: #19ff00;
    transition: width 0.4s ease;
  }

  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    align-items: center;
  }

  .label {
    width: 34%;
    padding-left: 14px;
    color: #050505;
    font-size: clamp(14px, 2vw, 24px);
    font-weight: 900;
    white-space: nowrap;
  }

  .amount {
    flex: 1;
    text-align: center;
    color: #111;
    font-size: clamp(16px, 2vw, 24px);
    font-weight: 800;
  }

  .target {
    width: 23%;
    padding-right: 14px;
    text-align: right;
    color: #111;
    font-size: clamp(16px, 2vw, 24px);
    font-weight: 800;
  }
</style>
</head>

<body>
<div class="goal-wrap">
  <div class="goal-bar">
    <div class="progress" id="progress"></div>

    <div class="content">
      <div class="label">PC UPGRADE</div>
      <div class="amount" id="amount">₹100</div>
      <div class="target" id="target">₹10000</div>
    </div>
  </div>
</div>

<script>
  // Change these two numbers.
  const currentAmount = 100;
  const goalAmount = 10000;

  // Automatically calculate the green progress.
  const percentage = Math.min(Math.max((currentAmount / goalAmount) * 100, 0), 100);

  document.getElementById("progress").style.width = percentage + "%";
  document.getElementById("amount").textContent =
    "₹" + currentAmount.toLocaleString("en-IN", { minimumFractionDigits: 2 });
  document.getElementById("target").textContent =
    "₹" + goalAmount.toLocaleString("en-IN");
</script>
</body>
</html>
